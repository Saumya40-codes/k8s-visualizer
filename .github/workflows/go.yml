name: Go

on:
  push:
    branches: [ "main", "master" ]
    paths-ignore:
      - 'ui/**'
      - 'README.md'
      - '.gitignore'
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26'

    - name: Build
      run: go build -v ./...
